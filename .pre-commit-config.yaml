# Install once:  pip install pre-commit && pre-commit install
# (installs both the pre-commit and pre-push hooks, see default_install_hook_types)
# Then update pinned versions:  pre-commit autoupdate
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: block-push-to-main
        name: block push to main/master (docs/CHANGE_POLICY.md)
        entry: bash scripts/git/block-push-to-main.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-json
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]
